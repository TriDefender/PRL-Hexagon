name: CI

# Cheap checks on every push and PR; APK packaging happens only in the
# manually triggered release-apk workflow.
on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check & script checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Kotlin compile check
        run: gradle --no-daemon :app:compileDebugKotlin
        working-directory: app

      - name: Shell syntax checks
        run: bash -n scripts/*.sh

      - name: Python syntax checks
        run: python3 -m py_compile miner/tests/*.py dsp/compound/test_*.py
