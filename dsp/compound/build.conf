# Sourced by scripts/build-dsp.sh and scripts/build-miner.sh.
PRL_SERVICE=prl_compound_bytefold_batch
PRL_SKEL_LIB=libprl_compound_bytefold_batch_skel.so
# Kernel build modes; the APK packages the mode listed in PRL_PACKAGE_MODE.
PRL_KERNEL_MODES=(0 1)
PRL_PACKAGE_MODE=1
PRL_MODE_DEFINE=PRL_BYTEFOLD_EARLY
# Extra defines passed only to the miner build.
PRL_MINER_DEFINES=(-Dprl_compound_batch_run=prl_compound_bytefold_batch_run)
# DSP kernel configuration (see kernel_impl.c for the meaning of each macro).
PRL_KERNEL_DEFINES=(
  -DPRL_SPECIALIZE_HOT=1
  -DPRL_SPECIALIZE_QUEUE=1
  -DPRL_WAIT_FASTPATH=1
  -DPRL_ASYNC_STAGE=1
  -DPRL_MM4_POINTER=1
  -DPRL_ADAPTIVE_SHARED=1
  -DPRL_HMX_CLOCK_POLICY=0
  -DPRL_AUTO_WORKERS=0
  -DPRL_GROUP_WORKERS=4
  -DPRL_SNAPSHOT_GROUP=16
  -DPRL_COMPACT_VTCM=2
  -DPRL_MM4_DEEP=1
  -DPRL_PREFETCH_ORDER=0
)
